<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Management - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/dashboard-admin.css">
</head>

<body>
    <div class="container">
        <nav class="sidebar">
            <div class="sidebar-header">
                <h3>School Management</h3>
                <p>Panel Administrateur</p>
            </div>
            <ul class="sidebar-menu">
                <li class="active"><a href="/statistiques"><i class="fa-solid fa-chart-pie"></i> Statistiques</a></li>
                <li><a href="/dashboard-etudiant"><i class="fa-solid fa-graduation-cap"></i> Étudiants</a></li>
                <li><a href="/dashboard-prof"><i class="fa-solid fa-chalkboard-user"></i> Enseignants</a></li>
                <li><a href="/matieres"><i class="fa-solid fa-book-open"></i> Matières</a></li>
                <li><a href="/notes"><i class="fa-solid fa-pen-to-square"></i> Notes</a></li>
                <li><a href="/absences"><i class="fa-solid fa-calendar-times"></i> Absences</a></li>
                <li><a href="/utilisateurs"><i class="fa-solid fa-users-gear"></i> Utilisateurs</a></li>
            </ul>
            <div class="sidebar-footer">
                <div class="user-info">
                    <p class="user-name">admin</p>
                    <p class="user-role">Administrateur</p>
                </div>
                <button class="logout-btn">Se déconnecter</button>
            </div>
        </nav>

        <main class="main-content">
            <header class="main-header">
                <h1>Statistiques</h1>
            </header>

            <section class="cards-section">
                <div class="card">
                    <p class="card-title">Étudiants</p>
                    <h2 class="card-number">4</h2>
                </div>
                <div class="card">
                    <p class="card-title">Enseignants</p>
                    <h2 class="card-number">4</h2>
                </div>
                <div class="card">
                    <p class="card-title">Matières</p>
                    <h2 class="card-number">4</h2>
                </div>
                <div class="card">
                    <p class="card-title">Absences</p>
                    <h2 class="card-number">3</h2>
                </div>
            </section>
        </main>
    </div>
    <script src="../js/api.js"></script>
    <script src="../js/dashboard-admin.js"></script>
</body>

</html>
